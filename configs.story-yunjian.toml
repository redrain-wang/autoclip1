llm_base_url = "https://opencode.ai/zen/go/v1"
llm_model = "deepseek-v4.1-flash"
# Go errors never switch automatically to a separately billed endpoint.
series = "雍正王朝"
# Refine narration for listeners, then check factual changes before TTS.
oral_edit = true
conflict_brief = true
style = "剧情先行的顺叙解说：完整交代事件起因、行动、结果和场景切换；先让观众跟上故事，再在关键转折解释选择与代价；不要求每段都讲观点，不按分钟数填剧情"
# Story length follows the selected conflict. target_seconds remains a legacy pacing reference.
# The broad limits prevent empty or runaway output; they are not a writing quota.
duration_profile = "long"
clips = 1
target_seconds = 1050
min_seconds = 60
max_seconds = 2700
opening = "original"
original_ratio_target = 0.6
portrait = true
vision = true
asr_backend = "mlx"
asr_model = "mlx-community/whisper-large-v3-turbo"
asr_prompt = "雍正王朝。康熙，胤禛，胤祥，胤禩，胤礽，李卫，田文镜，邬思道，年羹尧，张廷玉，索额图，佟国维，黄河，赈灾，户部。简体中文对白。"
tts = "edge"
edge_endpoint = "msedge"
voice = "zh-CN-YunjianNeural"
research_before_produce = true
identity_gate = true
identity_registry = "output/人物锚点/registry.json"
tts_rate = "+8%"
output = "output/顺叙解读-第九集"
max_api_calls = 100
