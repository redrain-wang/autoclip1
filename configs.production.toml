llm_base_url = "https://opencode.ai/zen/go/v1"
llm_model = "deepseek-v4.1-flash"
# Go errors never switch automatically to a separately billed endpoint.
series = "雍正王朝"
# Refine narration for listeners, then check factual changes before TTS.
oral_edit = true
conflict_brief = true
style = "历史权谋：分析人物动机、制度困境和普通人的共鸣，克制幽默，不强行玩梗"
# New stories only; produce selects each story independently and preserves old exports.
clips = 0
target_seconds = 190
min_seconds = 120
max_seconds = 240
opening = "original"
original_ratio_target = 0.6
portrait = true
vision = true
asr_backend = "mlx"
asr_model = "mlx-community/whisper-large-v3-turbo"
asr_prompt = "雍正王朝。康熙，胤禛，胤祥，胤禩，胤礽，李卫，田文镜，邬思道，年羹尧，张廷玉，索额图，佟国维，黄河，赈灾，户部。简体中文对白。"
tts = "edge"
edge_endpoint = "msedge"
voice = "zh-CN-YunyangNeural"
research_before_produce = true
# Legacy batch compatibility; produce overrides these with its mandatory --library gate.
identity_gate = true
identity_registry = "output/人物锚点/registry.json"
tts_rate = "+8%"
output = "output/新片-长版"
max_api_calls = 100
