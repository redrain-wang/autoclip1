<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>声音确认台</title><style>
:root{color-scheme:light;--ink:#243338;--muted:#647471;--accent:#176b58;--line:#dce3dc;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:15px}header{padding:32px 42px 24px;border-bottom:1px solid var(--line);background:var(--paper)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}h1{font-size:30px;margin:10px 0}p{line-height:1.7}.muted{color:var(--muted)}.stats{display:flex;gap:24px;flex-wrap:wrap;font-size:14px;margin-top:20px}.stats b{font-size:23px;margin-right:6px;color:var(--accent)}.layout{display:grid;grid-template-columns:280px 1fr;max-width:1480px;margin:auto}aside{padding:24px 18px;border-right:1px solid var(--line);height:calc(100vh - 220px);overflow:auto;position:sticky;top:0}main{padding:30px 34px;min-width:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--ink)}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--accent);color:white;border-color:var(--accent)}input[type=text],input[type=search],select{border:1px solid #b8c8be;background:white;padding:11px;border-radius:8px;max-width:100%;color:var(--ink)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:middle}aside input{width:100%;margin-bottom:12px}.group{display:block;text-align:left;width:100%;margin-bottom:8px;padding:14px;background:transparent}.group.active{background:#e0eee4;border-color:#7ea58e}.group strong{display:block;margin-bottom:5px}.group small{color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.notice{padding:13px 16px;background:#e8eee2;border-radius:9px;line-height:1.7;font-size:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:21px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.card h3{margin:0 0 7px;font-size:16px}.time{font-variant-numeric:tabular-nums;color:var(--accent);font-size:14px}.quote{min-height:48px;font-size:15px;line-height:1.7;margin:16px 0}.badge{display:inline-block;background:#edf0e9;color:var(--muted);border-radius:20px;padding:5px 9px;font-size:12px;margin-top:10px}.badge.named{background:#dceee3;color:#20664c}audio{width:100%;height:38px;margin:8px 0}video{width:100%;margin-top:12px;border-radius:8px;background:#1d2522}.sample-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.sample-actions button{font-size:12px;padding:7px 10px}.sample-actions label{font-size:13px;margin-right:auto}.save-panel{position:sticky;bottom:14px;padding:18px 20px;background:#fffefaf5;border:1px solid #c1d1c3;border-radius:13px;box-shadow:0 8px 30px #254a2b15;margin-top:24px}.save-panel .toolbar{margin:0}.save-panel p{font-size:12px;margin:10px 0 0}#message{position:fixed;right:25px;bottom:25px;max-width:440px;background:#243d32;color:white;padding:16px 22px;border-radius:10px;z-index:10;display:none}h2{margin:0;font-size:23px}a{color:var(--accent)}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px}.small{font-size:12px}#fatal{color:#a4362b;white-space:pre-wrap}#next{white-space:nowrap}@media(max-width:850px){header{padding:24px}.layout{grid-template-columns:1fr}aside{height:200px;position:relative;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}aside input{height:40px}.group{width:180px;flex-shrink:0}main{padding:22px}.cards{grid-template-columns:1fr}.topline{align-items:flex-start}h1{font-size:25px}}
@media(max-width:850px){header{padding:18px 22px}.stats{gap:14px;margin-top:12px}.stats b{font-size:20px}aside{height:135px;padding:14px 18px}main{padding:20px}.notice{font-size:13px}.save-panel{padding:13px}.save-panel .toolbar{gap:8px}.save-panel input[type=text]{width:155px}}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.person{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;gap:8px}.person .badge{margin:0}.person button{font-size:12px;padding:6px 10px}details{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:12px}summary{cursor:pointer;font-weight:600}details .group{width:100%;background:var(--paper)}@media(max-width:850px){aside{height:auto;max-height:240px;display:block;padding:12px 20px}aside>.group{display:inline-block;width:auto;margin:0 8px 0 0}aside>div{margin-top:12px}aside input{margin-top:12px}}
</style></head><body>
<header><div class="eyebrow">人物声音档案 · 人工确认</div><div class="topline"><div><h1 id="title">声音确认台</h1><div class="muted">先为你关心的人物建立少量参考，随后交给程序比对。无需认完全部声音组。</div></div><a href="/api/registry" target="_blank" rel="noopener">查看已确认声纹库 ↗</a></div><div class="stats" id="stats"></div></header>
<div id="fatal" role="alert"></div><div class="layout"><aside id="sidebar"></aside><main id="main"></main></div><div id="message" role="status" aria-live="polite"></div>
<script>
const TOKEN='__TOKEN__'; let state, current, sampleMap, sourceMap, selected=new Set(), heard=new Set(), visibleCount=4, query='', saving=false, showAll=false;
const $=s=>document.querySelector(s); const node=(tag,cls,text)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const time=s=>{let ms=Math.round(s*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,sec=Math.floor(ms/1000)%60;return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':')+'.'+String(ms%1000).padStart(3,'0')};
const decision=id=>state.review.decisions[id]||{status:'pending',name:''};
const statusText=d=>({named:'已确认 · '+d.name,unnamed:'无名角色 · 不入主要人物库',excluded:'已排除 · 不作声纹参考',pending:'待确认'})[d.status];
function toast(text){$('#message').textContent=text;$('#message').style.display='block';setTimeout(()=>$('#message').style.display='none',4500)}
async function api(url,opts){let r=await fetch(url,opts),v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
function stats(){const p=state.progress;$('#stats').replaceChildren();for(let [n,t] of [[p.characters.length,'位已建档人物'],[p.ready_count,'位已有 3 段以上参考']]){let e=node('span');e.append(node('b','',n),document.createTextNode(t));$('#stats').append(e)}}
function groupNames(g){return [...new Set(g.sample_ids.map(id=>decision(id)).filter(d=>d.status==='named').map(d=>d.name))]}
function openGroup(id){if(saving)return;current=id;visibleCount=4;selected.clear();render()}
function sidebar(){const aside=$('#sidebar');aside.replaceChildren();const home=node('button','group'+(!current?' active':''),'人物建档进度');home.onclick=()=>openGroup(null);aside.append(home);const toggle=node('button','group',showAll?'收起全部声音':'全部声音（排查用）');toggle.onclick=()=>{showAll=!showAll;sidebar()};aside.append(toggle);if(!showAll)return;const search=node('input');search.type='search';search.placeholder='查找角色或声音组';search.value=query;search.setAttribute('aria-label','查找角色或声音组');aside.append(search);const list=node('div');list.style.width='100%';aside.append(list);function rows(){list.replaceChildren();for(let g of state.manifest.groups){let names=groupNames(g),title=names.join(' / ')||'声音 '+g.id.split('-')[1];if(query&&!(`${title} ${g.id}`.includes(query)))continue;let b=node('button','group'+(g.id===current?' active':''));b.append(node('strong','',title),node('small','',`${g.sample_ids.length} 段候选 · 可选查看`));b.onclick=()=>openGroup(g.id);list.append(b)}}search.oninput=()=>{query=search.value;rows()};rows()}
function pauseOthers(target){document.querySelectorAll('audio,video').forEach(e=>{if(e!==target)e.pause()})}
async function submit(path,changes){if(saving)return false;saving=true;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{state=await api(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify({dataset_id:state.manifest.dataset_id,revision:state.review.revision,changes})});selected.clear();current=null;toast(path==='/api/finish'?'本轮已完成，比对结果已保存。剩余声音可以以后再处理。':'确认已保存，人物进度已更新。');render();return true}catch(e){toast(e.message);return false}finally{saving=false;buttons.forEach(b=>b.disabled=false)}}
const save=changes=>submit('/api/review',changes);
function overview(){const main=$('#main'),p=state.progress;main.replaceChildren();const hero=node('section','card');hero.append(node('h2','',p.finished?'本轮建档已完成':p.all_ready?'现在可以结束本轮':p.can_finish?'已可开始试比对，参考还可补充':'先认出你关心的主要人物'));
hero.append(node('p','',p.finished?'已使用你确认的原声完成剩余片段比对。匹配不确定的保留未知，之后遇到需要的人物再补。':p.all_ready?`你已确认 ${p.characters.length} 位人物，每位至少 3 段参考。如果你关心的人物已在下表，就可以点击完成，不必继续认所有声音组。`:'每位人物建议确认 3 段清晰、来自不同位置的原声。没有需要凑满的总人数，也不要求处理所有候选。'));
const finish=node('button','primary',p.finished?'重新生成比对结果':'完成本轮，开始自动比对');finish.disabled=!p.can_finish;finish.onclick=()=>submit('/api/finish');hero.append(finish);hero.append(node('p','muted small','3 段是开始试比对的参考数量建议，不保证准确率，也不代表已经覆盖全剧人物。'));
if(p.finished){let a=node('a','','查看本轮比对结果 ↗');a.href='/api/matches';a.target='_blank';a.rel='noopener';hero.append(a)}main.append(hero);
const heading=node('h2','','已建档人物');heading.style.margin='26px 0 16px';main.append(heading);const people=node('div','people');for(let person of p.characters){let card=node('section','person');card.append(node('strong','',person.name),node('div','badge '+(person.ready?'named':''),person.ready?`${person.count} 段参考 · 本轮够用`:`${person.count} / 3 段参考 · 建议补 ${3-person.count} 段`));const groups=[...new Set(person.sample_ids.filter(id=>sampleMap[id]).map(id=>sampleMap[id].group_id))];for(let gid of groups){let button=node('button','','查看 / 补充'+(groups.length>1?' · '+gid.split('-')[1]:''));button.onclick=()=>openGroup(gid);card.append(button)}people.append(card)}if(!p.characters.length)people.append(node('p','muted','还没有确认的角色。从下面的声音开始，认出谁就填写谁。'));main.append(people);
const status=node('p','muted',`已自动找到 ${p.suggested_count} 段可能属于已知人物的声音，已从新人物推荐中移开。机器匹配不会自动加入参考库。`);main.append(status);
const optional=node('details');optional.open=!!state.manifest.automatic_gap_requests||!p.can_finish;optional.append(node('summary','','可选：还有关心的人物没建档，再听几个新声音'));optional.append(node('p','muted','每次最多推荐 5 组尚未建档、且未匹配到已知人物的候选。它们也可能是熟人的不同声线或路人，不是必须完成的清单。'));for(let row of p.discovery){let b=node('button','group',`试听声音 ${row.group_id.split('-')[1]} · 寻找遗漏人物`);b.onclick=()=>openGroup(row.group_id);optional.append(b)}if(!p.discovery.length)optional.append(node('p','muted','暂时没有优先推荐的新声音。需要排查时可打开“全部声音”。'));main.append(optional);if(state.manifest.automatic_gap_requests){const note=node('div','notice','制作中有角色的声音依据尚未核实。请试听以下候选并确认你认出的角色；不确定的保留待确认。完成本轮后重跑原制作命令，系统会备份并合并你确认的参考，再自动核对稿件。');main.prepend(note);const gap=node('section');gap.style.marginTop='20px';gap.append(node('h2','','制作中待核实的声音'));for(const g of state.manifest.groups){const b=node('button','group',`试听声音 ${g.id.split('-')[1]} · ${g.sample_ids.length} 段`);b.onclick=()=>openGroup(g.id);gap.append(b)}main.insertBefore(gap,hero);finish.disabled=!p.can_finish;finish.textContent=p.finished?'本轮已保存，重跑制作命令':'保存本轮，返回自动制作'}}
function render(){stats();sidebar();if(!current){overview();return}renderGroup()}
function renderGroup(){const main=$('#main');main.replaceChildren();let g=state.manifest.groups.find(x=>x.id===current);let top=node('div','topline');top.append(node('h2','',`声音 ${g.id.split('-')[1]}`));let next=node('button','','返回人物进度');next.id='next';next.onclick=()=>openGroup(null);top.append(next);main.append(top);main.append(node('p','muted',`共 ${g.sample_ids.length} 段相似声音。先展示不同位置的代表片段；同一角色可能出现在多组中。`));main.append(node('div','notice','先试听，再勾选确实属于同一人的片段并填写角色名。分组只是机器建议；混入别人的片段请单独命名，噪声、音乐或多人混说可排除。'));
let discovery=state.progress.discovery.find(x=>x.group_id===g.id);let priority=discovery?g.preview_ids.filter(id=>discovery.sample_ids.includes(id)):g.preview_ids;let ids=[...priority,...g.sample_ids.filter(id=>!priority.includes(id))];if(discovery)ids=ids.filter(id=>discovery.sample_ids.includes(id));const cards=node('div','cards');cards.style.marginTop='22px';for(let id of ids.slice(0,visibleCount)){let s=sampleMap[id],src=sourceMap[s.source_id],d=decision(id);let card=node('section','card');card.append(node('h3','',`${src.label} · 原片位置`),node('div','time',`${time(s.start)} — ${time(s.end)} · ${(s.end-s.start).toFixed(1)} 秒`),node('div','badge '+d.status,statusText(d)),node('p','quote',s.text));let audio=node('audio');audio.controls=true;audio.preload='none';audio.src='/audio/'+id;audio.setAttribute('aria-label',`${src.label} ${time(s.start)} 原声`);audio.onplay=()=>{pauseOthers(audio)};audio.ontimeupdate=()=>{if(audio.currentTime>=Math.min(1,audio.duration||1)){heard.add(id);check.disabled=false;label.title=''}};card.append(audio);let actions=node('div','sample-actions'),label=node('label'),check=node('input');check.type='checkbox';check.checked=selected.has(id);check.disabled=!heard.has(id);if(check.disabled)label.title='请先播放试听';check.onchange=()=>{check.checked?selected.add(id):selected.delete(id);updateSelected()};label.append(check,document.createTextNode(' 已听，选中确认'));actions.append(label);let context=node('button','','看前后画面');context.onclick=()=>{context.disabled=true;let video=card.querySelector('video');if(!video){video=node('video');video.controls=true;video.preload='metadata';video.src='/context/'+id;video.onplay=()=>pauseOthers(video);video.onerror=()=>toast('画面加载失败，请确认原片仍在原位置');card.append(node('p','muted small','画面含前后各约 3 秒；播放时的镜头也可能在拍听话者。'),video)}video.play().catch(()=>{});context.disabled=false};actions.append(context);let exclude=node('button','','排除');exclude.onclick=()=>save({[id]:{status:'excluded'}});actions.append(exclude);if(d.status!=='pending'){let reset=node('button','','撤回确认');reset.onclick=()=>save({[id]:{status:'pending'}});actions.append(reset)}card.append(actions);cards.append(card)}main.append(cards);
if(visibleCount<ids.length){let more=node('button','','再显示 8 段');more.style.marginTop='18px';more.onclick=()=>{visibleCount+=8;render()};main.append(more)}
const panel=node('div','save-panel'),row=node('div','toolbar'),name=node('input');name.type='text';name.id='name';name.placeholder='角色名，如：康熙';name.maxLength=60;name.setAttribute('aria-label','确认角色名');name.setAttribute('list','names');let names=node('datalist');names.id='names';for(let n of new Set(Object.values(state.review.decisions).filter(d=>d.status==='named').map(d=>d.name))){let o=node('option');o.value=n;names.append(o)}let existing=groupNames(g);if(existing.length===1)name.value=existing[0];let count=node('span','muted');count.id='selected';let confirm=node('button','primary','确认所选片段');confirm.onclick=()=>{if(!selected.size){toast('请先试听并勾选片段');return}if(!name.value.trim()){toast('请填写角色名');name.focus();return}save(Object.fromEntries([...selected].map(id=>[id,{status:'named',name:name.value.trim()}])))};let unnamed=node('button','','标记为无名角色');unnamed.onclick=()=>{if(!selected.size){toast('请先试听并勾选片段');return}save(Object.fromEntries([...selected].map(id=>[id,{status:'unnamed'}])))};row.append(count,name,names,confirm,unnamed);panel.append(row,node('p','muted','只保存你勾选的片段。同名角色的已确认样本会合并入库；未勾选的继续待确认。无名角色不会合并成同一个人。'));main.append(panel);updateSelected()}
function updateSelected(){$('#selected').textContent=`已选 ${selected.size} 段`}
(async()=>{try{state=await api('/api/state');if(!state.manifest.groups.length)throw Error('没有候选声音，请先准备样本');sampleMap=Object.fromEntries(state.manifest.samples.map(s=>[s.id,s]));sourceMap=Object.fromEntries(state.manifest.sources.map(s=>[s.id,s]));current=null;$('#title').textContent=state.manifest.series+' · 声音确认台';render()}catch(e){$('#fatal').textContent=e.message}})();
</script></body></html>
