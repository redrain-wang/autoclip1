<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主要人物声纹补录</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:#243338;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.7}header,main{max-width:1060px;margin:auto;padding:25px 24px}header{padding-bottom:10px}h1{font-size:29px;margin:6px 0 12px}h2{font-size:23px;margin:7px 0}h3{margin:5px 0;font-size:17px}.eyebrow,.time{color:#176b58;font-size:13px}.muted{color:#68796e;font-size:13px}a{color:#176b58}.hero,.card{border:1px solid #dce3dc;border-radius:14px;background:#fffefa;padding:22px;margin:16px 0}.metrics{display:flex;gap:24px;flex-wrap:wrap}.metrics b{font-size:30px;color:#176b58;margin-right:5px}.progress{height:8px;background:#e0e7da;border-radius:9px;overflow:hidden;margin:13px 0}.progress i{height:100%;display:block;background:#34846a}.queue{display:flex;gap:9px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;padding:11px 15px;border:1px solid #cddbcf;border-radius:9px;color:#243338;background:#fffefa}button:hover{border-color:#176b58}button.active{border-color:#176b58;background:#dceee2}button.primary{background:#176b58;color:white;border-color:#176b58}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:16px 0}.badge{padding:3px 8px;background:#e5eee1;border-radius:6px;color:#32664f;font-size:12px}.notice{background:#ebf0e5;border-radius:8px;padding:12px 15px}.quote{font-size:18px;margin:20px 0}audio,video{width:100%;margin:10px 0}video{border-radius:9px;background:#15271e}.name{width:230px;padding:11px;border:1px solid #b8c9bd;border-radius:8px;color:#243338;background:white}.confirmed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.person{padding:13px;background:#fffefa;border:1px solid #dce3dc;border-radius:9px}.person b{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px}details{margin:16px 0}summary{cursor:pointer}#message{position:fixed;bottom:20px;right:20px;background:#254638;color:white;border-radius:10px;padding:14px 20px;max-width:440px;display:none;z-index:20}#fatal{color:#ad3528;padding:10px}.complete{color:#176b58}.scope{font-size:12px;color:#68796e;margin:12px 0 0}@media(max-width:650px){header,main{padding:20px}h1{font-size:25px}.hero,.card{padding:18px}.metrics{gap:16px}.confirmed{grid-template-columns:repeat(2,minmax(0,1fr))}.name{width:100%}.toolbar .primary{flex:1}}
</style></head><body><header><div class="eyebrow">按人物补齐 · 每次确认立即保存</div><h1>主要人物声纹补录</h1><div id="summary"></div><p class="scope" id="scope"></p></header><main><div id="fatal" role="alert"></div><div id="queue"></div><section id="candidate"></section><details><summary id="known-summary">查看已有参考</summary><div class="confirmed" id="known"></div></details><div class="toolbar"><button id="finish" class="primary">名单已补齐，完成本轮</button><a href="/api/registry" target="_blank" rel="noopener">查看合并声纹库 ↗</a></div><p class="muted">确认一段即可记录该人物身份；不同场景的多段参考有助于后续比对。备选片段只有经你另行试听确认才会入库。</p></main><div id="message" role="status" aria-live="polite"></div><script>
const TOKEN='__TOKEN__';let state,current,position=0,heard=new Set(),busy=false,samples,sources,discoveryIndex=0;
const $=s=>document.querySelector(s),el=(tag,cls,text)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const time=s=>{let ms=Math.round(s*1000);return [Math.floor(ms/3600000),Math.floor(ms/60000)%60,Math.floor(ms/1000)%60].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(ms%1000).padStart(3,'0')};
function toast(s){$('#message').textContent=s;$('#message').style.display='block';setTimeout(()=>$('#message').style.display='none',4500)}
async function api(path,body){let r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify({dataset_id:state.manifest.dataset_id,revision:state.review.revision,...body})}:undefined);let data=await r.json();if(!r.ok)throw Error(data.error||'操作失败');return data}
function refreshMaps(){samples=Object.fromEntries(state.manifest.samples.map(s=>[s.id,s]));sources=Object.fromEntries(state.manifest.sources.map(s=>[s.id,s]))}
async function save(sid,name,status='named'){if(busy)return;busy=true;try{state=await api('/api/review',{changes:{[sid]:{status,name}}});position=0;const remaining=state.progress.coverage.filter(t=>t.status!=='confirmed');if(current==='__discovery'){discoveryIndex=0;if(!state.progress.voice_discovery.length)current=remaining[0]?.id||null}else if(!remaining.some(t=>t.id===current))current=remaining.find(t=>t.status==='candidate')?.id||(state.progress.voice_discovery.length?'__discovery':remaining[0]?.id)||null;toast('已保存，人物覆盖进度已更新。');busy=false;render()}catch(e){toast(e.message)}finally{busy=false}}
function pauseOthers(media){document.querySelectorAll('audio,video').forEach(x=>{if(x!==media)x.pause()})}
function renderDiscovery(panel){let groups=state.progress.voice_discovery;if(!groups.length){panel.append(el('p','notice','这批优先声音已处理，名单中的缺口仍会保留。'));return}discoveryIndex=Math.min(discoveryIndex,groups.length-1);let group=groups[discoveryIndex],ids=group.preview_ids;position=Math.min(position,ids.length-1);let sid=ids[position],sample=samples[sid],source=sources[sample.source_id],card=el('div','card');card.append(el('div','eyebrow','全集扫描找到的未命名声音'),el('h2','',`代表声音 ${discoveryIndex+1} / ${groups.length}`),el('p','muted',`此候选组在 ${group.episodes} 集出现过 ${group.count} 段相似声音。分组只供选样；每次只确认当前这一段。`),el('p','time',`第 ${source.label} 集 · ${time(sample.start)} — ${time(sample.end)}`));let audio=el('audio');audio.controls=true;audio.preload='none';audio.src='/audio/'+sid;audio.setAttribute('aria-label','未命名代表声音');audio.onplay=()=>pauseOthers(audio);card.append(audio);let actions=el('div','toolbar');let context=el('button','','看前后画面');context.onclick=()=>{let video=card.querySelector('video');if(!video){video=el('video');video.controls=true;video.preload='metadata';video.src='/context/'+sid;video.onplay=()=>pauseOthers(video);card.append(video)}video.play().catch(()=>{})};let backup=el('button','','换另一处片段');backup.disabled=ids.length<2;backup.onclick=()=>{position=(position+1)%ids.length;render()};let skip=el('button','','先听其他声音');skip.onclick=()=>{discoveryIndex=(discoveryIndex+1)%groups.length;position=0;render()};actions.append(context,backup,skip);card.append(actions);let form=el('div','toolbar'),name=el('input','name');name.type='text';name.maxLength=60;name.placeholder='听出是谁，填角色名';name.setAttribute('aria-label','未命名声音的实际角色名');name.setAttribute('list','roster-names');let options=el('datalist');options.id='roster-names';for(let t of [...state.progress.coverage].sort((a,b)=>(a.status==='confirmed')-(b.status==='confirmed'))){let o=el('option');o.value=t.name;options.append(o)}let confirm=el('button','primary','确认并补入声纹库');confirm.disabled=true;name.oninput=()=>confirm.disabled=!heard.has(sid)||!name.value.trim();confirm.onclick=()=>{if(heard.has(sid)&&name.value.trim())save(sid,name.value.trim())};let unnamed=el('button','','无名角色');unnamed.disabled=!heard.has(sid);unnamed.onclick=()=>{if(heard.has(sid))save(sid,'','unnamed')};audio.ontimeupdate=()=>{if(audio.currentTime>=Math.min(1,audio.duration||1)){heard.add(sid);confirm.disabled=!name.value.trim();unnamed.disabled=false}};form.append(name,options,confirm,unnamed);card.append(form,el('p','muted small','先从声音和前后画面辨认人物。已有角色也可补充新场景参考；不认识时可先听其他声音。'));panel.append(card)}
function render(){const coverage=state.progress.coverage,done=coverage.filter(t=>t.status==='confirmed'),remaining=coverage.filter(t=>t.status!=='confirmed'),rest=state.progress.discovery_total>0&&!state.progress.voice_discovery.length&&!remaining.some(t=>t.status==='candidate');$('#scope').textContent=state.manifest.coverage_scope;
const summary=$('#summary');summary.replaceChildren();let metrics=el('div','metrics');for(let [n,label] of [[done.length+'/'+coverage.length,'位人物已确认'],[remaining.length,'位待补齐']]){let item=el('span');item.append(el('b','',n),document.createTextNode(label));metrics.append(item)}let bar=el('div','progress'),fill=el('i');fill.style.width=(100*done.length/coverage.length)+'%';bar.append(fill);summary.append(metrics,bar,el('div','muted',rest?'这轮能确认的声音已保存，暂时无需继续试听。剩余人物保留待定位。':remaining.length?'这页只处理名单中的缺口。先听每人一段；没把握可换备选或留待确认。':'本轮名单的每位人物都有人工确认声纹。后续新人物可继续增补。'));
const queue=$('#queue');queue.replaceChildren();if(remaining.length){queue.append(el('h2','','待补齐人物'));let buttons=el('div','queue');for(let t of remaining){let b=el('button',t.id===current?'active':'',t.name+(t.status==='not_located'?' · 待定位':''));b.onclick=()=>{if(busy)return;current=t.id;position=0;render()};buttons.append(b)}queue.append(buttons)}else queue.append(el('h2','complete','本轮名单已补齐'));if(state.progress.voice_discovery.length){let b=el('button',current==='__discovery'?'active':'primary','辨认全集找到的未命名声音 · '+state.progress.voice_discovery.length+' 组优先样本');b.style.marginTop='16px';b.onclick=()=>{current='__discovery';position=0;render()};queue.append(b)}
$('#known-summary').textContent=`已确认人物 ${done.length} 位（含原有参考）`;const known=$('#known');known.replaceChildren();for(let t of done){let box=el('div','person');box.append(el('b','',t.name),el('span','muted',`${t.count} 段人工参考`));known.append(box)}
const panel=$('#candidate');panel.replaceChildren();let target=coverage.find(t=>t.id===current);if(target&&target.status!=='confirmed'){const card=el('div','card');card.append(el('div','eyebrow',target.sample_ids.length?'待你最终确认':'待定位'),el('h2','',target.name));if(!target.sample_ids.length){card.append(el('p','','目前没有合适的待确认样本，该人物保留为缺口。暂时无需重复试听。'));panel.append(card)}else{position=Math.min(position,target.sample_ids.length-1);const sid=target.sample_ids[position],sample=samples[sid],source=sources[sample.source_id];card.append(el('span','badge',`候选 ${position+1} / ${target.sample_ids.length}`),el('p','time',`第 ${source.label} 集 · ${time(sample.start)} — ${time(sample.end)}`),el('p','quote',sample.text));let audio=el('audio');audio.controls=true;audio.preload='none';audio.src='/audio/'+sid;audio.setAttribute('aria-label',`${target.name}候选原声`);audio.onplay=()=>pauseOthers(audio);audio.onerror=()=>toast('原声加载失败，请确认原片仍在原位置');card.append(audio);let actions=el('div','toolbar'),context=el('button','','看前后画面'),next=el('button','','换一段备选');next.disabled=target.sample_ids.length<2;next.onclick=()=>{if(busy)return;position=(position+1)%target.sample_ids.length;render()};context.onclick=()=>{let video=card.querySelector('video');if(!video){video=el('video');video.controls=true;video.preload='metadata';video.src='/context/'+sid;video.onplay=()=>pauseOthers(video);video.onerror=()=>toast('画面加载失败，请稍后重试');card.append(video)}video.play().catch(()=>{})};actions.append(context,next);card.append(actions);
let detail=el('details'),basis=el('summary','','为什么选这段');detail.append(basis,el('p','muted',sample.candidate_basis));card.append(detail);
let form=el('div','toolbar'),name=el('input','name');name.type='text';name.maxLength=60;name.value=target.name;name.setAttribute('aria-label','实际角色名');let confirm=el('button','primary','确认这段是 '+target.name);confirm.disabled=!heard.has(sid);name.oninput=()=>{confirm.textContent='确认这段是 '+name.value;confirm.disabled=!heard.has(sid)||!name.value.trim()};audio.ontimeupdate=()=>{if(audio.currentTime>=Math.min(1,audio.duration||1)){heard.add(sid);confirm.disabled=!name.value.trim()}};confirm.onclick=()=>{if(heard.has(sid)&&name.value.trim())save(sid,name.value.trim())};form.append(name,confirm);card.append(form,el('p','muted small','先播放试听再确认。若实际是别人，可修改角色名；没把握时保持待确认。'));panel.append(card)}}
if(current==='__discovery')renderDiscovery(panel);const finish=$('#finish');finish.disabled=!state.progress.coverage_complete||busy;finish.textContent=state.progress.finished?'本轮名单已完成':state.progress.coverage_complete?'名单已补齐，完成本轮':rest?`已保存 · ${remaining.length} 位待定位`:`还有 ${remaining.length} 位待确认`;finish.onclick=async()=>{if(busy)return;busy=true;try{state=await api('/api/finish',{});toast('本轮完成，合并声纹库与比对结果已保存。');busy=false;render()}catch(e){toast(e.message)}finally{busy=false}}}
(async()=>{try{state=await api('/api/state');refreshMaps();current=state.progress.coverage.find(t=>t.status==='candidate')?.id||(state.progress.voice_discovery.length?'__discovery':state.progress.coverage.find(t=>t.status!=='confirmed')?.id)||null;render()}catch(e){$('#fatal').textContent=e.message}})();
</script></body></html>
