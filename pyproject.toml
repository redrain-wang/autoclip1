[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip-director"
version = "1.1.0"
description = "Evidence-grounded Chinese film commentary video pipeline"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2", "pydantic>=2.8,<3", "typer>=0.12,<1", "rich>=13,<16", "pillow>=10,<13", "edge-tts>=7,<8"]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4,<1"]
cpu = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
autoclip = "autoclip.cli:app"

[tool.setuptools.packages.find]
include = ["autoclip*"]

[tool.setuptools.package-data]
autoclip = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
